name: iOS simulator test
description: Runs the KaiyouGit scheme on the first available iPad simulator. Needs KAIYOUGIT_LOCAL_XCFRAMEWORK in the environment.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        udid=$(xcrun simctl list devices available -j | python3 -c '
        import json, sys
        for runtime, devices in json.load(sys.stdin)["devices"].items():
            if "iOS" not in runtime:
                continue
            for d in devices:
                if "iPad" in d["name"]:
                    print(d["udid"])
                    sys.exit(0)
        ')
        if [ -z "$udid" ]; then
          echo "No available iPad simulator on this runner" >&2
          xcrun simctl list devices available >&2
          exit 1
        fi
        echo "Using simulator $udid"
        xcodebuild test -scheme KaiyouGit -destination "platform=iOS Simulator,id=$udid"
